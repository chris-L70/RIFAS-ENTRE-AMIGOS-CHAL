<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(24, 24, 27, 0.75); backdrop-filter: blur(12px); }
        .ticket-selected { background-color: #dc2626 !important; border-color: #fca5a5 !important; color: white; transform: scale(1.05); }
        .ticket-sold { background-color: #27272a !important; color: #52525b; cursor: not-allowed; text-decoration: line-through; border: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans selection:bg-red-600/30">

    <nav class="sticky top-0 z-50 glass border-b border-white/5 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <span class="font-black tracking-tighter text-xl text-red-600">SORTEOS PREMIUM</span>
            <button onclick="document.getElementById('comprobante-section').scrollIntoView({behavior: 'smooth'})" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-xs font-bold border border-white/10 transition-all">
                📸 Sube tu Pago
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto p-4 space-y-6 pb-32">

        <section class="rounded-3xl overflow-hidden border border-white/10 bg-zinc-900 shadow-2xl relative">
            <img src="https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=800&q=80" alt="Premio Mayor" class="w-full h-64 md:h-96 object-cover opacity-80">
            <div class="absolute top-4 left-4 bg-red-600 text-xs font-black px-3 py-1.5 rounded-full uppercase tracking-wider">
                Gran Edición Temporal
            </div>
        </section>

        <section class="bg-zinc-900 border border-white/10 rounded-2xl p-6 text-center space-y-4 shadow-xl">
            <h3 class="text-xs font-bold uppercase tracking-widest text-zinc-400">El sorteo inicia en:</h3>
            <div class="grid grid-cols-4 gap-2 max-w-sm mx-auto text-center">
                <div class="bg-zinc-950 p-3 rounded-xl border border-white/5"><span id="days" class="block text-2xl md:text-3xl font-black text-red-500">00</span><span class="text-[10px] text-zinc-500 font-bold uppercase">Días</span></div>
                <div class="bg-zinc-950 p-3 rounded-xl border border-white/5"><span id="hours" class="block text-2xl md:text-3xl font-black text-red-500">00</span><span class="text-[10px] text-zinc-500 font-bold uppercase">Horas</span></div>
                <div class="bg-zinc-950 p-3 rounded-xl border border-white/5"><span id="minutes" class="block text-2xl md:text-3xl font-black text-red-500">00</span><span class="text-[10px] text-zinc-500 font-bold uppercase">Min</span></div>
                <div class="bg-zinc-950 p-3 rounded-xl border border-white/5"><span id="seconds" class="block text-2xl md:text-3xl font-black text-red-500">00</span><span class="text-[10px] text-zinc-500 font-bold uppercase">Seg</span></div>
            </div>
            <p class="text-xs text-zinc-400 font-medium">
                🔴 La transmisión en vivo se llevará a cabo a través de nuestras páginas oficiales de <span class="text-white font-bold">TikTok</span> y <span class="text-white font-bold">Facebook</span> basado en la Lotería Nacional.
            </p>
        </section>

        <section class="space-y-3">
            <button onclick="togglePaquetes()" class="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-black p-4 rounded-xl text-center flex justify-between items-center transition-all shadow-[0_4px_20px_rgba(245,158,11,0.2)]">
                <span>➡️ ESCOGE AQUÍ TUS BOLETOS ⬇️</span>
                <span id="arrow-icon">▼</span>
            </button>

            <div id="lista-paquetes" class="hidden bg-zinc-900 border border-white/10 rounded-2xl p-2 space-y-1 overflow-hidden transition-all">
                <button onclick="selectPaquete(1, 1)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>1 Boleto</span> <span class="text-amber-400">$1 MXN</span></button>
                <button onclick="selectPaquete(5, 2)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>5 Boletos</span> <span class="text-amber-400">$2 MXN</span></button>
                <button onclick="selectPaquete(10, 3)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>10 Boletos</span> <span class="text-amber-400">$3 MXN</span></button>
                <button onclick="selectPaquete(15, 5)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>15 Boletos</span> <span class="text-amber-400">$5 MXN</span></button>
                <button onclick="selectPaquete(20, 10)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>20 Boletos</span> <span class="text-amber-400">$10 MXN</span></button>
                <button onclick="selectPaquete(30, 15)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>30 Boletos</span> <span class="text-amber-400">$15 MXN</span></button>
                <button onclick="selectPaquete(40, 20)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>40 Boletos</span> <span class="text-amber-400">$20 MXN</span></button>
                <button onclick="selectPaquete(50, 25)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>50 Boletos</span> <span class="text-amber-400">$25 MXN</span></button>
                <button onclick="selectPaquete(100, 50)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>100 Boletos</span> <span class="text-amber-400">$50 MXN</span></button>
                <button onclick="selectPaquete(150, 75)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>150 Boletos</span> <span class="text-amber-400">$75 MXN</span></button>
                <button onclick="selectPaquete(200, 100)" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex justify-between text-sm font-bold border border-transparent hover:border-white/5"><span>200 Boletos</span> <span class="text-amber-400">$100 MXN</span></button>
                <button onclick="activarSeleccionAbierta()" class="w-full text-center p-3 rounded-xl bg-zinc-800 text-white text-xs font-black tracking-widest uppercase mt-2 hover:bg-zinc-700">
                    ➡️ Selección Abierta (Elegir a mano)
                </button>
            </div>
        </section>

        <section id="apartado-boletos" class="hidden bg-zinc-900 border border-white/10 rounded-3xl p-6 space-y-6 shadow-xl">
            <div class="text-center">
                <h2 class="text-lg font-black uppercase tracking-tight">Elige tus Números de la Suerte</h2>
                <p id="info-seleccion" class="text-xs text-zinc-400 mt-1"></p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="flex gap-2">
                    <input type="number" id="input-boleto-escrito" placeholder="Ej: 48" class="w-full bg-zinc-950 border border-white/10 p-3 rounded-xl text-center font-bold focus:outline-none focus:border-red-600">
                    <button onclick="agregarBoletoEscrito()" class="bg-zinc-800 hover:bg-zinc-700 font-bold px-4 rounded-xl border border-white/5 text-sm">Agregar</button>
                </div>
                <button onclick="generarAlAzar()" id="btn-azar" class="w-full bg-zinc-800 hover:bg-zinc-700 border border-white/5 text-sm font-bold
