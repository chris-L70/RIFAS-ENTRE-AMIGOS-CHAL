<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas Entre Amigos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ticket-selected { background-color: #ef4444 !important; color: white; transform: scale(1.05); }
        .ticket-sold { background-color: #374151 !important; cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans">

    <header class="py-8 text-center border-b border-zinc-800">
        <h1 class="text-4xl font-bold tracking-tighter text-red-600">RIFAS ENTRE AMIGOS</h1>
        <p class="text-zinc-400 mt-2 italic">Fabricando tu suerte</p>
    </header>

    <section class="max-w-4xl mx-auto p-6 text-center">
        <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl">
            <img src="https://via.placeholder.com/800x400" alt="Premio" class="w-full object-cover h-64">
            <div class="p-6">
                <h2 class="text-2xl font-bold uppercase">Combo Millonario + Súper Bonos</h2>
                <p class="text-red-500 font-bold text-xl mt-2">1 Boleto por $6 | 10 Boletos por $60</p>
            </div>
        </div>
    </section>

    <main class="max-w-5xl mx-auto p-6">
        <h3 class="text-center mb-6 text-zinc-500 uppercase tracking-widest text-sm font-semibold">Selecciona tus números</h3>
        <div id="ticket-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2 mb-20">
            </div>
    </main>

    <div id="checkout-bar" class="fixed bottom-0 w-full bg-zinc-900 border-t border-zinc-800 p-4 hidden">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-sm text-zinc-400">Seleccionados: <span id="selected-count" class="font-bold text-white">0</span></p>
                <p class="text-lg font-bold">Total: <span class="text-green-500" id="total-price">$0</span></p>
            </div>
            <button onclick="sendWhatsApp()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-full font-bold transition-all flex items-center gap-2">
                Apartar por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('ticket-grid');
        const checkoutBar = document.getElementById('checkout-bar');
        const selectedCount = document.getElementById('selected-count');
        const totalPrice = document.getElementById('total-price');
        let selectedTickets = [];

        // Generar 100 boletos (puedes cambiar a 1000)
        for (let i = 1; i <= 1000; i++) {
            const btn = document.createElement('button');
            btn.innerText = i.toString().padStart(2, '0');
            btn.className = 'bg-zinc-800 border border-zinc-700 py-3 rounded-lg text-sm font-medium hover:border-red-500 transition-all';
            
            btn.onclick = () => {
                if (selectedTickets.includes(i)) {
                    selectedTickets = selectedTickets.filter(t => t !== i);
                    btn.classList.remove('ticket-selected');
                } else {
                    selectedTickets.push(i);
                    btn.classList.add('ticket-selected');
                }
                updateUI();
            };
            grid.appendChild(btn);
        }

        function updateUI() {
            selectedCount.innerText = selectedTickets.length;
            totalPrice.innerText = `$${selectedTickets.length * 6}`;
            checkoutBar.classList.toggle('hidden', selectedTickets.length === 0);
        }

        function sendWhatsApp() {
            const phone = "521234567890"; // Reemplaza con tu número
            const msg = `Hola! Quiero apartar los boletos: ${selectedTickets.join(', ')}. Total: $${selectedTickets.length * 6}`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
